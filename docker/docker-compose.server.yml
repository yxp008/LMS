# LMS 服务端（Docker Compose）
# 容器间用服务名互访，宿主机用 localhost

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: LMS
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../docker/sql:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: server
    environment:
      SERVER_PORT: "8088"
      LMS_CLICKHOUSE_URL: http://clickhouse:8123
      LMS_KAFKA_BROKER: kafka:9092
      LMS_SERVER_URL: http://server:8088
    ports:
      - "8088:8088"
    depends_on:
      - kafka
      - clickhouse

  processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: processor
    environment:
      LMS_CLICKHOUSE_URL: http://clickhouse:8123
      LMS_KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
      - clickhouse

volumes:
  kafka_data:
  clickhouse_data:
