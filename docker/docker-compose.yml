# LMS 全栈部署（单机测试用）

services:
  # ===== 基础服务 =====
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: LMS
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../server/database_design/sql:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"

  # ===== LMS 服务端 =====
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: server
    environment:
      LMS_CLICKHOUSE_URL: http://clickhouse:8123
      LMS_KAFKA_BROKER: kafka:9092
      LMS_SERVER_URL: http://server:8080
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - clickhouse
    volumes:
      - server_logs:/app/logs

  processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: processor
    environment:
      LMS_CLICKHOUSE_URL: http://clickhouse:8123
      LMS_KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
      - clickhouse

  # ===== LMS 客户端 =====
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: collector
    environment:
      LMS_KAFKA_BROKER: kafka:9092
      LMS_SERVER_URL: http://server:8080
    ports:
      - "8081:8081"
    depends_on:
      - server

  vector:
    image: timberio/vector:0.56.0-alpine
    volumes:
      - ../client/collector/vector_wsl.toml.template:/etc/vector/vector.toml:ro
      - vector_data:/var/lib/vector
    depends_on:
      - kafka
      - collector

volumes:
  kafka_data:
  clickhouse_data:
  server_logs:
  vector_data:
