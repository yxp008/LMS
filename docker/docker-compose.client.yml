# LMS 客户端（Vector + 采集器管理）
# Vector 需要直接访问系统日志源（journald/syslog），建议在宿主机安装
# 容器内仅运行采集器管理界面

services:
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: collector
    environment:
      LMS_KAFKA_BROKER: ${LMS_KAFKA_BROKER:-localhost:9092}
      LMS_SERVER_URL: ${LMS_SERVER_URL:-http://localhost:8080}
    ports:
      - "8081:8081"
