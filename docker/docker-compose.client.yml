# LMS 客户端（Docker Compose）
# 与服务端共享 lms_net 网络

services:
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: collector
    environment:
      COLLECTOR_PORT: "8081"
      LMS_KAFKA_BROKER: ${LMS_KAFKA_BROKER:-kafka:9092}
      LMS_SERVER_URL: ${LMS_SERVER_URL:-http://server:8088}
    ports:
      - "8081:8081"
    networks:
      - lms_net

networks:
  lms_net:
    external: true
