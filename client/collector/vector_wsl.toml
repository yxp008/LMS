# =========================================
# Vector 配置 - LMS 日志管理系统 (模板)
# =========================================
#
# 此文件由 server.py 根据 collection_prefs.json 动态生成 vector_wsl.toml
#

data_dir = "/home/yxp/LMS_mimo/client/collector/vector_data"

# =========================================
# 采集层 (Collection Layer)
# =========================================

[sources.journald]
type = "journald"
current_boot_only = true
# --- Kafka 缓冲 ---
[sinks.kafka_journald_out]
type = "kafka"
inputs = ["cleanup_journald"]
bootstrap_servers = "localhost:9092"
topic = "lms_elk_logs"
encoding.codec = "json"

[sources.syslog_udp]
type = "syslog"
mode = "udp"
address = "0.0.0.0:1514"
max_length = 102400

[sources.syslog_tcp]
type = "syslog"
mode = "tcp"
address = "0.0.0.0:1514"
max_length = 102400


# =========================================
# 处理层 (Processing Layer)
# 格式化字段 + 动态收集额外字段到 Tags
# =========================================

# --- journald 处理 ---
[transforms.process_journald]
type = "remap"
inputs = ["journald"]
source = '''
# 生成 Log_ID
ts = now()
rand_s = to_string(random_int(min: 1000, max: 9999))
log_ts = replace(to_string(to_unix_timestamp(ts) * 1000), ".", "")
.Log_ID = "L" + log_ts + rand_s
.Timestamp = ts

# Level 映射: 0-3(emerg~err)→ERROR, 4-5(warning~notice)→WARN, 7(debug)→DEBUG, 6(info)→INFO
.pri, _e = to_int(.PRIORITY)
if _e != null { .pri = 6 }
.Level = if .pri == 0 || .pri == 1 || .pri == 2 || .pri == 3 { "3" }
    else if .pri == 4 || .pri == 5 { "2" }
    else if .pri == 7 { "4" }
    else if .pri == 6 { "1" }
    else { to_string(.pri) }

# 提取标准字段
.Host = "localhost"
if exists(.HOSTNAME) { .Host = string!(.HOSTNAME) }
.Message = ""
if exists(.MESSAGE) { .Message = string!(.MESSAGE) }
else if exists(.message) { .Message = string!(.message) }
# 判断来源类型：根据标识符或消息内容识别网络设备日志
.syslog_id = ""
if exists(.SYSLOG_IDENTIFIER) { .syslog_id = upcase(string!(.SYSLOG_IDENTIFIER)) }
._is_network = false
# 通过标识符前缀判断（常见网络设备命名）
if starts_with(.syslog_id, "SW-") || starts_with(.syslog_id, "ROUTER-") || starts_with(.syslog_id, "FW-") || starts_with(.syslog_id, "CORE-") || starts_with(.syslog_id, "ACC-") || starts_with(.syslog_id, "DIST-") || starts_with(.syslog_id, "DS-") || starts_with(.syslog_id, "AS-") || starts_with(.syslog_id, "CS-") || starts_with(.syslog_id, "RS-") { ._is_network = true }
# 通过消息内容判断（Cisco/IOS 风格: %FACILITY-SEVERITY-MNEMONIC）
.msg_upper = upcase(.Message)
if match(.msg_upper, r'%[A-Z]+-[0-9]+-[A-Z_]+') { ._is_network = true }
if match(.msg_upper, r'(UPDOWN|LINEPROTO|LINK|INTERFACE|GIGABITETHERNET|FASTETHERNET)') && match(.msg_upper, r'(CHANGED STATE|CHANGE|UP|DOWN)') { ._is_network = true }
.Source_Type = if ._is_network { "网络设备日志" } else { "Linux系统日志" }
.Collector_ID = "C_LAPTOP_0ca52635"

# 动态收集额外字段到 Tags
.Tags = .
del(.Tags.Log_ID)
del(.Tags.Timestamp)
del(.Tags.Level)
del(.Tags.Host)
del(.Tags.Message)
del(.Tags.Source_Type)
del(.Tags.Collector_ID)
del(.Tags.Tags)
del(.Tags.PRIORITY)
del(.Tags.HOSTNAME)
del(.Tags.MESSAGE)
del(.Tags.message)
del(.Tags.SYSLOG_IDENTIFIER)
del(.Tags.SYSLOG_FACILITY)
del(.Tags.SYSLOG_PID)
del(.Tags._PID)
del(.Tags._UID)
del(.Tags._GID)
del(.Tags._COMM)
del(.Tags._EXE)
del(.Tags._CMDLINE)
del(.Tags._SYSTEMD_CGROUP)
del(.Tags._SYSTEMD_SLICE)
del(.Tags._BOOT_ID)
del(.Tags._MACHINE_ID)
del(.Tags._SESSION_ID)
del(.Tags._SYSTEMD_UNIT)
del(.Tags._TRANSPORT)
del(.Tags._SYSTEMD_INVOCATION_ID)
del(.Tags.__REALTIME_TIMESTAMP)
del(.Tags.__MONOTONIC_TIMESTAMP)
del(.Tags._SEQNUM)
del(.Tags._SYSTEMD_USER_UNIT)
del(.Tags.pri)
del(.Tags._e)
del(.Tags.syslog_id)
del(.Tags._is_network)
del(.Tags.msg_upper)
'''

# --- journald 清理 Vector 内部元数据 ---
[transforms.cleanup_journald]
type = "remap"
inputs = ["process_journald"]
source = '''
# 删除 Vector 在 VRL 之后注入的内部元数据
del(.Tags._SOURCE_MONOTONIC_TIMESTAMP)
del(.Tags.source_type)
del(.Tags.timestamp)
del(.Tags.host)
del(.Tags.source_ip)
del(.Tags.source)
del(.Tags._CAP_EFFECTIVE)
del(.Tags._SELINUX_CONTEXT)
del(.Tags._STREAM_ID)
del(.Tags._SOURCE_REALTIME_TIMESTAMP)
'''

# --- syslog 处理 ---
[transforms.process_syslog]
type = "remap"
inputs = ["syslog_udp", "syslog_tcp"]
source = '''
# 生成 Log_ID
ts = now()
rand_s = to_string(random_int(min: 1000, max: 9999))
log_ts = replace(to_string(to_unix_timestamp(ts) * 1000), ".", "")
.Log_ID = "L" + log_ts + rand_s
.Timestamp = ts

# Level 映射
.raw_sev = "info"
if exists(.severity) { .raw_sev = string!(.severity) }
if exists(.level) { .raw_sev = string!(.level) }
.sev = downcase(.raw_sev)
.Level = if .sev == "emerg" || .sev == "alert" || .sev == "crit" || .sev == "err" || .sev == "error" { "3" }
    else if .sev == "warning" || .sev == "warn" { "2" }
    else if .sev == "debug" { "4" }
    else { "1" }

# 提取标准字段
.Host = "unknown"
if exists(.appname) { .Host = string!(.appname) }
else if exists(.hostname) { .Host = string!(.hostname) }
else if exists(.host) { .Host = string!(.host) }
.Message = ""
if exists(.message) { .Message = string!(.message) }
else if exists(.msg) { .Message = string!(.msg) }
.Source_Type = "网络设备日志"
.Collector_ID = "C_LAPTOP_0ca52635"

# 动态收集额外字段到 Tags
.Tags = .
del(.Tags.Log_ID)
del(.Tags.Timestamp)
del(.Tags.Level)
del(.Tags.Host)
del(.Tags.Message)
del(.Tags.Source_Type)
del(.Tags.Collector_ID)
del(.Tags.Tags)
del(.Tags.severity)
del(.Tags.level)
del(.Tags.hostname)
del(.Tags.host)
del(.Tags.message)
del(.Tags.msg)
del(.Tags.raw_sev)
del(.Tags.sev)
del(.Tags.appname)
del(.Tags.facility)
del(.Tags.procid)
del(.Tags.msgid)
del(.Tags.source)
del(.Tags.protocol)
del(.Tags.version)
del(.Tags.source_ip)
del(.Tags.source_type)
del(.Tags.timestamp)
'''

# --- syslog 清理 Vector 内部元数据 ---
[transforms.cleanup_syslog]
type = "remap"
inputs = ["process_syslog"]
source = '''
del(.Tags._SOURCE_MONOTONIC_TIMESTAMP)
del(.Tags.source_type)
del(.Tags.timestamp)
del(.Tags.host)
del(.Tags.source_ip)
del(.Tags.source)
'''

# --- Kafka 缓冲 ---
[sinks.kafka_syslog_out]
type = "kafka"
inputs = ["cleanup_syslog"]
bootstrap_servers = "localhost:9092"
topic = "lms_elk_logs"
encoding.codec = "json"


# =========================================
# 存储层 (Storage Layer)
# =========================================

# ClickHouse 写入由 Processor 处理，不再经 Vector

